AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  twistlenbackendsam

  Sample SAM Template for twistlenbackend

Globals:
  Function:
    Timeout: 3
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
  Api:
    TracingEnabled: true
    # Cors:
    #     AllowMethods: "GET,POST,PUT,DELETE"
    #     AllowHeaders: "content-type"
    #     AllowOrigin: "*"
  
  HttpApi:
    CorsConfiguration:
      AllowCredentials: false
      AllowHeaders:
        - Content-Type
        - X-Amz-Date
        - Authorization
        - X-Api-Key
        - X-Amz-Security-Token
        - X-Amz-User-Agent
        - X-Amzn-Trace-Id
      AllowMethods:
        - OPTIONS
        - GET
        - POST
        - PUT
        - DELETE
      AllowOrigins:
        - "*"
Resources:

  # S3 Bucket for storing additional data related to the tables
  TwistlenS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: twistlen-storage-bucket
  # ------------------------------
  # DynamoDB Table
  # ------------------------------
  TwistlenTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TwistlenItems
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Users
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # Table to store the shared link details
  LinksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Links
      AttributeDefinitions:
        - AttributeName: shortCode
          AttributeType: S
      KeySchema:
        - AttributeName: shortCode
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # Table to store detailed visit logs (optional)
  LinkVisitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: LinkVisits
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # Table to store product details
  ProductDetailsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ProductDetails
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # Table to store offer details
  OfferDetailsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: OfferDetails
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  CommentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Comments
      AttributeDefinitions:
        - AttributeName: commentId
          AttributeType: S
      KeySchema:
        - AttributeName: commentId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Orders
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: sessionId  # For anonymous users
          AttributeType: S
        - AttributeName: userId     # For logged-in users
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: SessionIdIndex
          KeySchema:
            - AttributeName: sessionId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  CartsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Carts
      AttributeDefinitions:
        - AttributeName: cartId
          AttributeType: S
        - AttributeName: sessionId  # For anonymous users
          AttributeType: S
        - AttributeName: userId     # For logged-in users
          AttributeType: S
      KeySchema:
        - AttributeName: cartId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: SessionIdIndex
          KeySchema:
            - AttributeName: sessionId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  # Lambda Function(PageFunction)
  PageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: pageHandler/
      Handler: app.lambdaHandler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref TwistlenS3Bucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: TwistlenItems  # Allow CRUD operations on the table
        - S3CrudPolicy:
            BucketName: !Ref TwistlenS3Bucket
      Events:
        GetPage:
          Type: Api
          Properties:
            Path: /pages
            Method: get
        PostPage:
          Type: Api
          Properties:
            Path: /pages
            Method: post
        PutPage:   
          Type: Api
          Properties:
            Path: /pages
            Method: put
        OptionsPage:
          Type: Api
          Properties:
            Path: /pages
            Method: OPTIONS
        DeletePage: 
          Type: Api
          Properties:
            Path: /pages
            Method: delete
  # Lambda Function(AuthFunction)
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: authHandler/
      Handler: app.lambda_handler  
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref TwistlenS3Bucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Users
        - S3CrudPolicy:
            BucketName: !Ref TwistlenS3Bucket
      Events:
        UsersAPI:  # ✅ General Users CRUD API
          Type: Api
          Properties:
            Path: /users
            Method: ANY
  
        GetUser:  # ✅ Fetch user by ID
          Type: Api
          Properties:
            Path: /users/{id}
            Method: get
  
        CreateUser:  # ✅ Create a new user
          Type: Api
          Properties:
            Path: /users
            Method: post
  
        UpdateUser:  # ✅ Update user details
          Type: Api
          Properties:
            Path: /users/{id}
            Method: put
  
        DeleteUser:  # ✅ Delete user
          Type: Api
          Properties:
            Path: /users/{id}
            Method: delete
  
        Register:
          Type: Api
          Properties:
            Path: /register
            Method: post
  
        Login:
          Type: Api
          Properties:
            Path: /login
            Method: post
  
        Verify:
          Type: Api
          Properties:
            Path: /verify
            Method: get
  
        ForgotPassword:
          Type: Api
          Properties:
            Path: /forgot-password
            Method: post
  
        ChangePassword:
          Type: Api
          Properties:
            Path: /change-password
            Method: post

        RefreshToken:
          Type: Api
          Properties:
            Path: /refresh-token
            Method: post

        UpdateProfile:
          Type: Api
          Properties:
            Path: /update-profile
            Method: post

        GetProfile:
          Type: Api
          Properties:
            Path: /get-user-profile
            Method: get
 
  # ------------------------------
  # New Lambda Function for Link Sharing & Tracking
  # ------------------------------
  LinkSharingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: linkHandler/
      Handler: app.lambda_handler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          LINKS_TABLE: !Ref LinksTable
          VISITS_TABLE: !Ref LinkVisitsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LinksTable
        - DynamoDBCrudPolicy:
            TableName: !Ref LinkVisitsTable
      Events:
        CreateLink:
          Type: Api
          Properties:
            Path: /create-link
            Method: post
        RedirectLink:
          Type: Api
          Properties:
            Path: /{shortCode}
            Method: get

  DiscussionHubFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: commentHandler/
      Handler: app.lambda_handler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          COMMENTS_TABLE: !Ref CommentsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CommentsTable
      Events:
        CreateComment:
          Type: Api
          Properties:
            Path: /comments
            Method: post
        GetComments:
          Type: Api
          Properties:
            Path: /comments
            Method: get
        UpdateComment:
          Type: Api
          Properties:
            Path: /comments/{commentId}
            Method: put
        DeleteComment:
          Type: Api
          Properties:
            Path: /comments/{commentId}
            Method: delete

  # Lambda Function(ProductDetailsFunction)
  ProductDetailsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: productHandler/
      Handler: app.lambdaHandler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref TwistlenS3Bucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: ProductDetailsTable  # Allow CRUD operations on the table
        - DynamoDBCrudPolicy:
            TableName: OfferDetailsTable  # Allow CRUD operations on the table
        - S3CrudPolicy:
            BucketName: !Ref TwistlenS3Bucket
      Events:
        GetProductsLists:
          Type: Api
          Properties:
            Path: /products/getproductLists
            Method: get
        GetOffersLists:
          Type: Api
          Properties:
            Path: /offers/getOfferLists
            Method: get
        GetProductById:
          Type: Api
          Properties:
            Path: /products/getProduct
            Method: get
        GetOfferById:
          Type: Api
          Properties:
            Path: /offers/getOffer
            Method: get
        PostProduct:
          Type: Api
          Properties:
            Path: /products/addProduct
            Method: post
        PostOffer:
          Type: Api
          Properties:
            Path: /offers/addOffer
            Method: post
        PutProduct:   
          Type: Api
          Properties:
            Path: /products
            Method: put
        OptionsProduct:
          Type: Api
          Properties:
            Path: /products
            Method: OPTIONS
        OptionsOffer:
          Type: Api
          Properties:
            Path: /offers
            Method: OPTIONS
        DeleteProduct: 
          Type: Api
          Properties:
            Path: /products/deleteProduct
            Method: delete
        DeleteOffer: 
          Type: Api
          Properties:
            Path: /offers/deleteOffer
            Method: delete

  OrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: orderHandler/
      Handler: app.lambdaHandler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersTable
          PRODUCTS_TABLE: !Ref ProductDetailsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBReadPolicy:
            TableName: !Ref ProductDetailsTable
      Events:
        CreateOrder:
          Type: HttpApi
          Properties:
            Path: /orders
            Method: post
        GetOrder:
          Type: HttpApi
          Properties:
            Path: /orders/{orderId}
            Method: get
        GetUserOrders:
          Type: HttpApi
          Properties:
            Path: /users/orders
            Method: get
        GetSessionOrders:
          Type: HttpApi
          Properties:
            Path: /session/orders
            Method: get

  CartFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: cartHandler/
      Handler: app.lambdaHandler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          CARTS_TABLE: !Ref CartsTable
          PRODUCTS_TABLE: !Ref ProductDetailsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CartsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ProductDetailsTable
      Events:
        GetCart:
          Type: HttpApi
          Properties:
            Path: /cart
            Method: get
        ManageCart:
          Type: HttpApi
          Properties:
            Path: /cart/items
            Method: ANY
        TransferCart:
          Type: HttpApi
          Properties:
            Path: /cart/transfer
            Method: post